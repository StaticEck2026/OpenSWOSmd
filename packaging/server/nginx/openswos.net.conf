# openswos.net: the landing page (packaging/web/site in the repo, copied to
# /var/www/openswos.net). The server's own pages are online.openswos.net's.
server {
    listen 80;
    listen [::]:80;
    server_name openswos.net www.openswos.net;
    # Let's Encrypt proves the name here (certbot --webroot), first issue and renewals.
    location /.well-known/acme-challenge/ { root /var/www/openswos.net; }
    location / { return 301 https://openswos.net$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openswos.net;

    ssl_certificate     /etc/letsencrypt/live/openswos.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openswos.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    root /var/www/openswos.net;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

# www.openswos.net: the same certificate, one address -- it sends you to openswos.net.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.openswos.net;

    ssl_certificate     /etc/letsencrypt/live/openswos.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openswos.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 301 https://openswos.net$request_uri;
}
