# openswos.net: the landing page (packaging/web/site in the repo, copied to
# /var/www/openswos.net). The server's own pages are online.openswos.net's.
server {
    listen 80;
    listen [::]:80;
    server_name openswos.net www.openswos.net;
    # Let's Encrypt proves the name here (certbot --webroot), first issue and renewals.
    location /.well-known/acme-challenge/ { root /var/www/openswos.net; }
    location / { return 301 https://openswos.net$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openswos.net;

    ssl_certificate     /etc/letsencrypt/live/openswos.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openswos.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    root /var/www/openswos.net;
    index index.html;
    location / { try_files $uri $uri/ =404; }

    # The web version (make WASM=1, dist/web): the game in the browser, its data built in
    # (the owner's call, 2026-10-21). Compressed on the way: SWOS.data alone is ~26 MB.
    location = /game { return 301 /game/; }
    location /game/ {
        index SWOS.html;
        # Ask the server every time (a 304 when nothing changed). Without it a browser
        # keeps the files as long as it likes, and after an update ran the new page with
        # yesterday's SWOS.js/.wasm: the on-screen controls drew, but the game it called
        # had no touch functions, so FIRE did nothing (2026-10-22).
        add_header Cache-Control "no-cache" always;
        gzip on;
        gzip_types application/wasm application/octet-stream application/javascript;
        gzip_min_length 1024;
    }
}

# www.openswos.net: the same certificate, one address -- it sends you to openswos.net.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.openswos.net;

    ssl_certificate     /etc/letsencrypt/live/openswos.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openswos.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 301 https://openswos.net$request_uri;
}
