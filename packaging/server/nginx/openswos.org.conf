# openswos.org and www.openswos.org: held so nobody else has them; both send you to
# https://openswos.net. Their certificate is Let's Encrypt's, like the others.
server {
    listen 80;
    listen [::]:80;
    server_name openswos.org www.openswos.org;
    # Let's Encrypt proves the names here (certbot --webroot), first issue and renewals.
    location /.well-known/acme-challenge/ { root /var/www/openswos.net; }
    location / { return 301 https://openswos.net$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openswos.org www.openswos.org;

    ssl_certificate     /etc/letsencrypt/live/openswos.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openswos.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 301 https://openswos.net$request_uri;
}
