# online.openswos.net: the OpenSWOS server's web side (docs/NETPLAY_SETUP.md section 12,
# tools/matchmaker-admin/README.md). The game itself talks to the matchmaker on 19602,
# not here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name online.openswos.net;
    # Plain http only redirects (certbot --nginx adds its own challenge location to renew).
    location / { return 301 https://online.openswos.net$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name online.openswos.net;

    ssl_certificate     /etc/letsencrypt/live/online.openswos.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/online.openswos.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Everything here is for us, not the public: the recordings, the recordings player
    # (/playback/, added by scripts/swos-matchmaker-service.sh install), the match reports
    # (both players' SWOS.log, local addresses included) and the admin page. One login,
    # the admin page's, for all of it. The fetch scripts send it and then clear what they
    # fetched.
    auth_basic "OpenSWOS server";
    auth_basic_user_file /etc/nginx/.htpasswd-matchmaker-admin;

    location = / { auth_basic off; default_type text/plain; return 200 "OpenSWOS online server\n"; }

    include /etc/nginx/snippets/swos-playback.conf;
    location /recordings/ {
        alias /srv/swos-matchmaker/recordings/;
        autoindex on;
        autoindex_exact_size on;    # exact bytes: the fetch scripts delete only a file at the size they fetched
    }

    location /reports/ {
        alias /srv/swos-matchmaker/reports/;
        autoindex on;
    }

    # The admin page: an unprivileged gateway on 127.0.0.1:8899.
    location /cc/ {
        proxy_pass http://127.0.0.1:8899/;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
