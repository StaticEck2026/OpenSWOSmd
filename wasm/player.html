<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SWOS Playback</title>
  <!-- The recordings player (make WASM=1 PLAYER=1, docs/PLAYBACK.md): SWOS.html?srp=<name>
       plays <recordings>/<name> -- the server's /recordings/, beside /playback/ -- under a
       scrub bar, so a moment in a match can be found and named by its frame. &f=<frame>
       opens it paused there; the page keeps the address in step as you scrub. -->
  <style>
    :root { --bar: 120px; --fg: #d8d8d8; --dim: #8a8a8a; --accent: #6c6; --bg: #000; --panel: #151515; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
                 font: 13px/1.4 system-ui, sans-serif; }
    #stage { position: absolute; top: 0; left: 0; right: 0; bottom: var(--bar);
             display: flex; align-items: center; justify-content: center; }
    #canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; max-height: 100%;
              width: auto; height: 100%; object-fit: contain; display: block; outline: none; background: #000; }
    #status { position: absolute; top: 8px; left: 0; right: 0; text-align: center; color: var(--accent);
              font: 12px/1.4 monospace; pointer-events: none; }
    #bar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar); box-sizing: border-box;
           background: var(--panel); border-top: 1px solid #2a2a2a; padding: 8px 16px;
           display: flex; flex-direction: column; gap: 6px; }
    /* The bar's handle is a fixed 14 px so the timeline above can be inset by half of it
       and put every frame under the handle's centre (a browser's own handle size varies). */
    #scrub { width: 100%; margin: 0; height: 14px; background: transparent; -webkit-appearance: none; appearance: none; }
    #scrub::-webkit-slider-runnable-track { height: 4px; background: #3a3a3a; border-radius: 2px; }
    #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px;
                                   border: none; border-radius: 50%; background: var(--accent); }
    #scrub::-moz-range-track { height: 4px; background: #3a3a3a; border-radius: 2px; }
    #scrub::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--accent); }
    #tlwrap { position: relative; margin: 0 7px; }
    #tlwrap[hidden] { display: none; }
    #playhead { position: absolute; top: -2px; bottom: -2px; width: 1px; margin-left: -1px;
                background: var(--accent); pointer-events: none; }
    /* What each player saw (PRED): a row a player, one column a slice of frames. */
    #timeline { width: 100%; height: 16px; display: block; cursor: pointer; background: #0b0b0b; }
    #bal { font: 12px/1.4 monospace; color: var(--dim); }
    .balw { color: #30d0ff; } .tsw { color: #6080ff; }
    .pred[hidden] { display: none; }
    #lag { font: 12px/1.4 monospace; color: var(--dim); }
    #read { font: 12px/1.4 monospace; color: var(--dim); min-height: 1.4em; padding: 2px 0 0; }
    #read .late { color: #ffb040; }
    .p1 { color: #ffe600; } .p2 { color: #ffffff; } .bad { color: #ff4040; } .off { color: #ff9a30; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button { background: #242424; color: var(--fg); border: 1px solid #3a3a3a; border-radius: 4px;
             padding: 3px 9px; font: inherit; cursor: pointer; min-width: 36px; }
    button:hover { background: #2e2e2e; }
    #frame { font: 13px/1.4 monospace; min-width: 21ch; }
    #name { color: var(--dim); font: 12px/1.4 monospace; margin-left: auto; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
    a { color: var(--accent); }
    #help, .help { color: var(--dim); font-size: 12px; }
    .help { margin-left: auto; }
    @media (max-width: 600px) { #help, #name { display: none; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="status">loading…</div>
  </div>
  <div id="bar">
    <div id="tlwrap" hidden><canvas id="timeline" title="What each player saw: top row player 1 (yellow), bottom row player 2 (white). Brighter = more of the other player's input guessed; orange = a guess was wrong; red = the player saw something that did not happen; a dotted line = no data from that player. The thin line under a row: cyan = that player's game was slowed by a prediction balance wait, blue = by a time sync wait. Click to jump."></canvas><div id="playhead"></div></div>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="Frame">
    <div class="row">
      <button id="back10" title="10 frames back (Shift+Left)">&laquo;10</button>
      <button id="back1" title="One frame back (Left)">&lsaquo;1</button>
      <button id="play" title="Play / pause (Space)">&#10074;&#10074;</button>
      <button id="fwd1" title="One frame on (Right)">1&rsaquo;</button>
      <button id="fwd10" title="10 frames on (Shift+Right)">10&raquo;</button>
      <span id="frame">frame – / –</span>
      <button id="copy" title="Copy a link to this frame">copy link</button>

      <span id="help">Space pause &middot; &larr; &rarr; one frame &middot; Shift ten</span>
      <span id="name"></span>
      <a href="./">all recordings</a>
    </div>
    <div class="row pred" hidden>
      <button id="prevEv" title="The previous moment a player saw something that did not happen ([)">&lsaquo; rollback</button>
      <button id="nextEv" title="The next moment a player saw something that did not happen (])">rollback &rsaquo;</button>
      <button id="screen" title="Whose screen the picture is: the match as it was finally played, or what one player's screen showed (S)">screen: the match</button>
      <button id="view" title="Whose view the overlay draws (V)">view: both</button>
      <span id="bal" title="The match's input delay, and whether the prediction balance was on (it takes both players)"></span>
      <span id="lag"></span>
      <span id="help2" class="help">[ ] rollbacks &middot; S screen &middot; V view</span>
    </div>
    <div id="read" title="What each player's own game READ from its controls on this frame, how long after its previous read, and the frame that input was played on (read + the input delay). Orange: a frame that came more than 30 ms after the one before."></div>
  </div>

  <script type="text/javascript">
    var q = new URLSearchParams(location.search);
    var srp = q.get('srp');
    // The recordings folder: the server's /recordings/, beside this page's /playback/.
    var base = q.get('base') || '../recordings/';
    var startFrame = parseInt(q.get('f') || '', 10);
    var startScreen = parseInt(q.get('screen') || '', 10);      // 1 | 2: that player's screen
    var statusEl = document.getElementById('status');

    if (!srp || !/^[A-Za-z0-9._-]+\.SRP$/i.test(srp))
      location.replace('./');                   // no recording named: the list

    var Module = {
      canvas: document.getElementById('canvas'),
      // Keys: SDL listens on the canvas only (a hint set by --replay-player in src/main.c).
      // Not Module.keyboardListeningElement -- that is SDL1's, and Emscripten 4+ aborts on
      // a Module property it does not use (INCOMING_MODULE_JS_API).
      arguments: ['--replay-player=/in/' + srp],
      preRun: [function () {
        try { FS.mkdir('/in'); } catch (e) { /* already there */ }
        FS.createPreloadedFile('/in', srp, base + encodeURIComponent(srp), true, false);
      }],
      // The controls call into the game only once its runtime is up.
      onRuntimeInitialized: function () { window.swosReady = true; },
      setStatus: function (text) {
        statusEl.textContent = text;
        statusEl.style.display = text ? 'block' : 'none';
      },
      print:    function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
    };
    Module.setStatus('downloading…');
    window.onerror = function () { Module.setStatus('error — see console (F12)'); };
    document.getElementById('name').textContent = srp || '';
    document.title = (srp || '') + ' — SWOS Playback';
    // Who played whom: the recorder's card beside the recording (docs/PLAYBACK.md).
    if (srp) fetch(base + encodeURIComponent(srp.replace(/\.SRP$/i, '.json')), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (c) {
        if (!c || !c.players) return;
        function side(i) {
          var p = c.players[i], t = (c.teams || [])[i];
          return (p && p.name ? p.name : '?') + (t ? ' (' + t + ')' : '');
        }
        var text = side(0) + (c.score ? '  ' + c.score[0] + '-' + c.score[1] + '  ' : ' v ') + side(1);
        document.getElementById('name').textContent = text;
        document.getElementById('name').title = srp;
        window.matchTitle = text + ' — SWOS Playback';
        document.title = window.matchTitle;
        // The players by name wherever the page would say P1 / P2 (the line under the bar,
        // the view button, the timeline's tooltip).
        window.playerNames = [0, 1].map(function (i) {
          var p = c.players[i];
          return p && p.name ? p.name : '';
        });
        if (window.onPlayerNames) window.onPlayerNames();
      }).catch(function () {});

    // ---- The controls: the player API in src/replay_v2.c (ReplayV2_Player*) ----
    (function () {
      var scrub = document.getElementById('scrub'), frameEl = document.getElementById('frame');
      var playBtn = document.getElementById('play');
      var api = null, dragging = false, seeded = false, lastShown = -1, lastUrl = -1;

      function bind() {
        if (api || !window.swosReady || typeof Module._ReplayV2_PlayerFrames !== 'function') return api;
        api = {
          frames:   Module._ReplayV2_PlayerFrames,
          rate:     Module._ReplayV2_PlayerTickRate,
          frame:    Module._ReplayV2_PlayerFrame,
          paused:   Module._ReplayV2_PlayerPaused,
          pause:    Module._ReplayV2_PlayerPause,
          seek:     Module._ReplayV2_PlayerSeek,
          step:     Module._ReplayV2_PlayerStep,
          has:      Module._ReplayV2_PlayerPrediction,
          predAt:   Module._ReplayV2_PlayerPredAt,
          readInfo: Module._ReplayV2_PlayerReadInfo,     // absent in a player built before READ
          readAt:   Module._ReplayV2_PlayerReadAt,
          overlay:  Module._ReplayV2_PlayerOverlay,
          screen:   Module._ReplayV2_PlayerPerspective,
        };
        return api;
      }

      // ---- what each player saw (PRED and SEEN, docs/PLAYBACK.md) ----
      // The PRED byte (include/srp_writer.h): lag in the low 4 bits, 0x10 stalled,
      // 0x20 replayed by a rollback; the player adds 0x40 "its guess was wrong" and
      // 0x80 "SEEN has it drawn elsewhere". 0xFF: that player's half never arrived.
      var pred = null, timeline = document.getElementById('timeline'), lagEl = document.getElementById('lag');
      var viewBtn = document.getElementById('view'), screenBtn = document.getElementById('screen');
      // A player by name when the recording's card has one (typed by players, so escaped
      // wherever it goes into HTML), else "P1" / "P2".
      function nameOf(p) {
        var n = window.playerNames && window.playerNames[p];
        return n ? n : 'P' + (p + 1);
      }
      function esc(t) {
        return String(t).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function viewName(m) { return ['off', nameOf(0), nameOf(1), 'both'][m]; }
      window.onPlayerNames = function () {
        lastShown = -1;                                   /* the line under the bar again */
        viewBtn.textContent = 'view: ' + viewName(api ? api.overlay(-1) : 3);
        showScreen();
        timeline.title = timeline.title.replace(/top row [^,]*\(yellow\), bottom row [^.]*\(white\)/,
          'top row ' + nameOf(0) + ' (yellow), bottom row ' + nameOf(1) + ' (white)');
      };
      // seen: something was drawn somewhere it never was. wrong: a guess was not the input
      // that came, whether or not it moved anything visibly.
      function seen(b)  { return b !== 0xFF && (b & 0x80) !== 0; }
      function wrong(b) { return b !== 0xFF && (b & 0xC0) !== 0; }
      // READ (docs/REPLAY_FORMAT_V2.md): per frame per player, which wait that player's game
      // was taking -- 1 a prediction balance wait, 2 a time sync wait; 0xFF no data.
      var waits = null, readCtl = null, readMs = null, readDelay = 0;
      function loadRead(n) {
        var balEl = document.getElementById('bal');
        if (typeof api.readInfo !== 'function' || typeof api.readAt !== 'function') return;
        var info = api.readInfo();
        if (info < 0) { balEl.textContent = 'balance: not recorded'; return; }
        waits = new Uint8Array(2 * n);
        readCtl = new Int16Array(2 * n);      // -1: that player's frame was not recorded
        readMs = new Uint8Array(2 * n);
        readDelay = info & 0xFF;
        for (var f = 0; f < n; f++)
          for (var p = 0; p < 2; p++) {
            var v = api.readAt(f, p + 1);
            waits[2 * f + p] = v < 0 ? 0xFF : (v >> 16) & 0xFF;
            readCtl[2 * f + p] = v < 0 ? -1 : v & 0xFF;
            readMs[2 * f + p] = v < 0 ? 0 : (v >> 8) & 0xFF;
          }
        var on = (info >> 8) & 3;
        balEl.innerHTML = 'input delay ' + (info & 0xFF) + ' &middot; balance: ' +
          (on === 3 ? '<span class="balw">ON</span>' :
           on === 0 ? 'off' : 'off (only ' + esc(nameOf(on === 1 ? 0 : 1)) + ' had it on)');
      }
      function loadPred(n) {
        loadRead(n);
        if (!(api.has() & 1)) return;
        pred = new Uint8Array(2 * n);
        for (var f = 0; f < n; f++) { var v = api.predAt(f); pred[2 * f] = v & 0xFF; pred[2 * f + 1] = (v >> 8) & 0xFF; }
        document.getElementById('tlwrap').hidden = false;
        document.querySelector('.pred').hidden = false;
        drawTimeline();
      }
      function drawTimeline() {
        if (!pred) return;
        var n = pred.length / 2, w = timeline.clientWidth || 600, h = 16;
        timeline.width = w; timeline.height = h;
        var g = timeline.getContext('2d');
        g.fillStyle = '#0b0b0b'; g.fillRect(0, 0, w, h);
        var rgb = [[255, 230, 0], [235, 235, 235]];
        // Column x holds the frames whose handle position falls in it: the slider puts frame
        // f at f / (n - 1) of its track, and the timeline spans exactly that track.
        for (var x = 0; x < w; x++) {
          var a = Math.ceil((x - 0.5) * (n - 1) / w), b = Math.ceil((x + 0.5) * (n - 1) / w);
          a = Math.max(0, a); b = Math.min(n, Math.max(a + 1, b));
          for (var p = 0; p < 2; p++) {
            var lag = 0, bad = false, off = false, known = false, wait = 0;
            for (var f = a; f < b; f++) {
              if (waits && waits[2 * f + p] !== 0xFF) wait |= waits[2 * f + p];
              var v = pred[2 * f + p];
              if (v === 0xFF) continue;
              known = true;
              lag = Math.max(lag, v & 15);
              if (seen(v)) bad = true;
              else if (wrong(v)) off = true;
            }
            // Under the row: the wait that player's game was taking, balance over time sync.
            if (wait & 3) { g.fillStyle = (wait & 1) ? '#30d0ff' : '#4058c8'; g.fillRect(x, p * 8 + 5, 1, 2); }
            if (!known) {                       // no data from this player: a dotted line
              if (x % 3 === 0) { g.fillStyle = '#555'; g.fillRect(x, p * 8 + 2, 1, 1); }
              continue;
            }
            if (bad) g.fillStyle = '#ff4040';
            else if (off) g.fillStyle = '#b86a20';
            else if (!lag) continue;
            else { var k = 0.25 + 0.75 * Math.min(lag, 8) / 8, c = rgb[p];
                   g.fillStyle = 'rgb(' + (c[0] * k | 0) + ',' + (c[1] * k | 0) + ',' + (c[2] * k | 0) + ')'; }
            g.fillRect(x, p * 8, 1, 5);
          }
        }
      }
      window.addEventListener('resize', drawTimeline);
      timeline.addEventListener('click', function (e) {
        if (!bind() || !pred) return;
        var r = timeline.getBoundingClientRect(), n = pred.length / 2;
        api.pause(1);
        api.seek(Math.round((e.clientX - r.left) / r.width * (n - 1)));
      });
      // The start of the next (or previous) run of frames drawn wrong, for the views shown.
      function eventAt(f) {
        var m = api.overlay(-1) || 3;
        return ((m & 1) && seen(pred[2 * f])) || ((m & 2) && seen(pred[2 * f + 1]));
      }
      function jump(dir) {
        if (!bind() || !pred) return;
        var n = pred.length / 2, f = api.frame() + dir;
        for (; f > 0 && f < n; f += dir)
          if (eventAt(f) && !eventAt(f - 1)) { api.pause(1); api.seek(f); return; }
      }
      function lagText(f) {
        if (!pred) return '';
        var out = [];
        for (var p = 0; p < 2; p++) {
          var v = pred[2 * f + p], cls = 'p' + (p + 1);
          if (v === 0xFF) { out.push('<span class="' + cls + '">' + esc(nameOf(p)) + ' –</span>'); continue; }
          var t = esc(nameOf(p)) + ' guessed ' + (v & 15);
          if (v & 0x20) t += ', replayed';
          if (v & 0x10) t += ', stalled';
          var wv = waits ? waits[2 * f + p] : 0xFF;
          if (wv !== 0xFF && (wv & 1)) t += ', <span class="balw">balance wait</span>';
          else if (wv !== 0xFF && (wv & 2)) t += ', <span class="tsw">time sync wait</span>';
          out.push('<span class="' + cls + '">' + t + '</span>' +
                   (seen(v) ? ' <span class="bad">saw it wrong</span>' :
                    wrong(v) ? ' <span class="off">guess wrong, not visible</span>' : ''));
        }
        return out.join(' &middot; ');
      }
      // READ: the controls each player's game read on this frame (MATCH_* bits, match_step.h),
      // how long after its previous read, and where the match played them.
      function controlsText(c) {
        var d = (c & 1 ? '\u2191' : '') + (c & 2 ? '\u2193' : '') + (c & 4 ? '\u2190' : '') + (c & 8 ? '\u2192' : '');
        var out = [];
        if (d) out.push(d);
        if (c & 0x20) out.push('FIRE');
        if (c & 0x40) out.push('BENCH');
        return out.length ? out.join(' ') : 'nothing';
      }
      function readText(f) {
        if (!readCtl) return '';
        var out = [], n = readCtl.length / 2;
        for (var p = 0; p < 2; p++) {
          var c = readCtl[2 * f + p], cls = 'p' + (p + 1);
          if (c < 0) { out.push('<span class="' + cls + '">' + esc(nameOf(p)) + ' read \u2013</span>'); continue; }
          var ms = readMs[2 * f + p], t = esc(nameOf(p)) + ' read ' + controlsText(c);
          // What the fire button did since the read before (SRP_READ_FIRE_*, 2026-10-13):
          // 4 a press arrived, 8 it was up again already and the latch read it as pressed.
          var fv = waits ? waits[2 * f + p] : 0xFF;
          if (fv !== 0xFF && (fv & 8)) t += ' (a tap, kept by the latch)';
          else if (fv !== 0xFF && (fv & 4) && !(c & 0x20)) t += ' (a fire press came and went unread)';
          else if (fv !== 0xFF && (fv & 4)) t += ' (pressed now)';
          var gap = f === 0 ? '' : ', ' + (ms === 255 ? '255+' : ms) + ' ms after the last';
          if (ms > 30 && f > 0) gap = '<span class="late">' + gap + '</span>';
          out.push('<span class="' + cls + '">' + t + '</span>' + gap);
        }
        var at = f + readDelay;
        return out.join(' &middot; ') + ' &middot; played on frame ' + (at < n ? at : at + ' (after the end)') +
               ' (delay ' + readDelay + ')';
      }
      // Whose screen the picture is: 0 the match as finally played, 1 / 2 that player's --
      // every man and the ball drawn where that player's game drew them (SEEN).
      function screenName(m) { return m ? esc(nameOf(m - 1)) + "'s screen" : 'the match'; }
      function showScreen() {
        var m = api && api.screen ? api.screen(-1) : 0;
        screenBtn.innerHTML = 'screen: ' + screenName(m);
      }
      screenBtn.onclick = function () {
        if (!bind() || !api.screen) return;
        api.screen((api.screen(-1) + 1) % 3);    // the match -> player 1 -> player 2
        showScreen();
      };
      viewBtn.onclick = function () {
        if (!bind()) return;
        var m = (api.overlay(-1) + 3) % 4;       // both -> player 2 -> player 1 -> off -> both
        api.overlay(m);
        viewBtn.textContent = 'view: ' + viewName(m);
      };
      function clock(frame, rate) {
        var s = rate > 0 ? Math.floor(frame / rate) : 0;
        return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
      }
      function frameUrl(f) {
        var u = new URL(location.href);
        u.searchParams.set('f', f);
        var m = api && api.screen ? api.screen(-1) : 0;   // the screen being shown goes with it
        if (m) u.searchParams.set('screen', m); else u.searchParams.delete('screen');
        return u.toString();
      }
      function tick() {
        requestAnimationFrame(tick);
        // The game names its window (SDL_SetWindowTitle is the tab's title): the match wins.
        if (window.matchTitle && document.title !== window.matchTitle) document.title = window.matchTitle;
        if (!bind()) return;
        var n = api.frames();
        if (n <= 0) return;
        if (!seeded) {                          // the recording is in: size the bar, honour &f=
          seeded = true;
          scrub.max = String(n - 1);
          if (startFrame >= 0) { api.seek(startFrame); api.pause(1); }
          loadPred(n);
          if ((startScreen === 1 || startScreen === 2) && api.screen) { api.screen(startScreen); showScreen(); }
          // No card (or one without names): the recording itself names its players (PLYR).
          if (!window.playerNames && Module.cwrap) {
            var nm = Module.cwrap('ReplayV2_PlayerName', 'string', ['number']);
            var names = [nm(1), nm(2)];
            if (names[0] || names[1]) {
              window.playerNames = names;
              if (!window.matchTitle) {
                var t = (names[0] || '?') + ' v ' + (names[1] || '?');
                document.getElementById('name').textContent = t;
                window.matchTitle = t + ' — SWOS Playback';
              }
              window.onPlayerNames();
            }
          }
          Module.setStatus('');
        }
        var f = api.frame(), rate = api.rate();
        if (!dragging) scrub.value = String(f);
        if (f !== lastShown) {
          lastShown = f;
          frameEl.textContent = 'frame ' + f + ' / ' + (n - 1) + '  ' + clock(f, rate);
          if (pred) {
            lagEl.innerHTML = lagText(f);
            document.getElementById('read').innerHTML = readText(f);
            document.getElementById('playhead').style.left = (n > 1 ? f / (n - 1) * 100 : 0) + '%';
          }
        }
        playBtn.innerHTML = api.paused() ? '&#9654;' : '&#10074;&#10074;';
        // The address follows a paused frame, so a reload or a copied URL lands on it.
        if (api.paused() && f !== lastUrl) {
          lastUrl = f;
          history.replaceState(null, '', frameUrl(f));
        }
      }
      requestAnimationFrame(tick);

      scrub.addEventListener('input', function () {
        dragging = true;
        if (bind()) api.seek(parseInt(scrub.value, 10));
      });
      scrub.addEventListener('change', function () { dragging = false; });
      function step(d) { if (bind()) api.step(d); }
      function toggle() { if (bind()) api.pause(api.paused() ? 0 : 1); }
      document.getElementById('back10').onclick = function () { step(-10); };
      document.getElementById('back1').onclick  = function () { step(-1); };
      document.getElementById('fwd1').onclick   = function () { step(1); };
      document.getElementById('fwd10').onclick  = function () { step(10); };
      playBtn.onclick = toggle;
      document.getElementById('prevEv').onclick = function () { jump(-1); };
      document.getElementById('nextEv').onclick = function () { jump(1); };
      document.getElementById('copy').onclick = function () {
        if (!bind()) return;
        api.pause(1);
        var url = frameUrl(api.frame()), btn = this;
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
          .then(function () { btn.textContent = 'copied'; },
                function () { prompt('Link to this frame:', url); })
          .then(function () { setTimeout(function () { btn.textContent = 'copy link'; }, 1500); });
      };
      document.addEventListener('keydown', function (e) {
        if (e.target === scrub && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) e.preventDefault();
        if (e.key === ' ') { toggle(); e.preventDefault(); }
        else if (e.key === 'ArrowLeft')  { step(e.shiftKey ? -10 : -1); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { step(e.shiftKey ? 10 : 1); e.preventDefault(); }
        else if (e.key === ']') { jump(1); e.preventDefault(); }
        else if (e.key === '[') { jump(-1); e.preventDefault(); }
        else if (e.key === 'v' || e.key === 'V') { viewBtn.click(); e.preventDefault(); }
        else if (e.key === 's' || e.key === 'S') { screenBtn.click(); e.preventDefault(); }
      });
    })();
  </script>
