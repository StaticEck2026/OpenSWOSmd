<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SWOS Playback</title>
  <!-- The recordings player (make WASM=1 PLAYER=1, docs/PLAYBACK.md): SWOS.html?srp=<name>
       plays <recordings>/<name> -- the server's /recordings/, beside /playback/ -- under a
       scrub bar, so a moment in a match can be found and named by its frame. &f=<frame>
       opens it paused there; the page keeps the address in step as you scrub. -->
  <style>
    :root { --bar: 120px; --fg: #d8d8d8; --dim: #8a8a8a; --accent: #6c6; --bg: #000; --panel: #151515; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
                 font: 13px/1.4 system-ui, sans-serif; }
    #stage { position: absolute; top: 0; left: 0; right: 0; bottom: var(--bar);
             display: flex; align-items: center; justify-content: center; }
    #canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; max-height: 100%;
              width: auto; height: 100%; object-fit: contain; display: block; outline: none; background: #000; }
    #status { position: absolute; top: 8px; left: 0; right: 0; text-align: center; color: var(--accent);
              font: 12px/1.4 monospace; pointer-events: none; }
    #bar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar); box-sizing: border-box;
           background: var(--panel); border-top: 1px solid #2a2a2a; padding: 8px 16px;
           display: flex; flex-direction: column; gap: 6px; }
    #scrub { width: 100%; margin: 0; accent-color: var(--accent); }
    /* What each player saw (PRED): a row a player, one column a slice of frames. */
    #timeline { width: 100%; height: 12px; display: block; cursor: pointer; background: #0b0b0b; }
    #timeline[hidden], .pred[hidden] { display: none; }
    #lag { font: 12px/1.4 monospace; color: var(--dim); }
    .p1 { color: #ffe600; } .p2 { color: #ffffff; } .bad { color: #ff4040; } .off { color: #ff9a30; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button { background: #242424; color: var(--fg); border: 1px solid #3a3a3a; border-radius: 4px;
             padding: 3px 9px; font: inherit; cursor: pointer; min-width: 36px; }
    button:hover { background: #2e2e2e; }
    #frame { font: 13px/1.4 monospace; min-width: 21ch; }
    #name { color: var(--dim); font: 12px/1.4 monospace; margin-left: auto; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
    a { color: var(--accent); }
    #help, .help { color: var(--dim); font-size: 12px; }
    .help { margin-left: auto; }
    @media (max-width: 600px) { #help, #name { display: none; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="status">loading…</div>
  </div>
  <div id="bar">
    <canvas id="timeline" hidden title="What each player saw: top row player 1 (yellow), bottom row player 2 (white). Brighter = more of the other player's input guessed; orange = a guess was wrong; red = the player saw something that did not happen. Click to jump."></canvas>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="Frame">
    <div class="row">
      <button id="back10" title="10 frames back (Shift+Left)">&laquo;10</button>
      <button id="back1" title="One frame back (Left)">&lsaquo;1</button>
      <button id="play" title="Play / pause (Space)">&#10074;&#10074;</button>
      <button id="fwd1" title="One frame on (Right)">1&rsaquo;</button>
      <button id="fwd10" title="10 frames on (Shift+Right)">10&raquo;</button>
      <span id="frame">frame – / –</span>
      <button id="copy" title="Copy a link to this frame">copy link</button>

      <span id="help">Space pause &middot; &larr; &rarr; one frame &middot; Shift ten</span>
      <span id="name"></span>
      <a href="./">all recordings</a>
    </div>
    <div class="row pred" hidden>
      <button id="prevEv" title="The previous moment a player saw something that did not happen ([)">&lsaquo; rollback</button>
      <button id="nextEv" title="The next moment a player saw something that did not happen (])">rollback &rsaquo;</button>
      <button id="view" title="Whose view the overlay draws (V)">view: both</button>
      <span id="lag"></span>
      <span id="help2" class="help">[ ] rollbacks &middot; V view</span>
    </div>
  </div>

  <script type="text/javascript">
    var q = new URLSearchParams(location.search);
    var srp = q.get('srp');
    // The recordings folder: the server's /recordings/, beside this page's /playback/.
    var base = q.get('base') || '../recordings/';
    var startFrame = parseInt(q.get('f') || '', 10);
    var statusEl = document.getElementById('status');

    if (!srp || !/^[A-Za-z0-9._-]+\.SRP$/i.test(srp))
      location.replace('./');                   // no recording named: the list

    var Module = {
      canvas: document.getElementById('canvas'),
      // SDL listens for keys on the canvas only, so the page's shortcuts stay the page's.
      keyboardListeningElement: document.getElementById('canvas'),
      arguments: ['--replay-player=/in/' + srp],
      preRun: [function () {
        try { FS.mkdir('/in'); } catch (e) { /* already there */ }
        FS.createPreloadedFile('/in', srp, base + encodeURIComponent(srp), true, false);
      }],
      // The controls call into the game only once its runtime is up.
      onRuntimeInitialized: function () { window.swosReady = true; },
      setStatus: function (text) {
        statusEl.textContent = text;
        statusEl.style.display = text ? 'block' : 'none';
      },
      print:    function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
    };
    Module.setStatus('downloading…');
    window.onerror = function () { Module.setStatus('error — see console (F12)'); };
    document.getElementById('name').textContent = srp || '';
    document.title = (srp || '') + ' — SWOS Playback';

    // ---- The controls: the player API in src/replay_v2.c (ReplayV2_Player*) ----
    (function () {
      var scrub = document.getElementById('scrub'), frameEl = document.getElementById('frame');
      var playBtn = document.getElementById('play');
      var api = null, dragging = false, seeded = false, lastShown = -1, lastUrl = -1;

      function bind() {
        if (api || !window.swosReady || typeof Module._ReplayV2_PlayerFrames !== 'function') return api;
        api = {
          frames:   Module._ReplayV2_PlayerFrames,
          rate:     Module._ReplayV2_PlayerTickRate,
          frame:    Module._ReplayV2_PlayerFrame,
          paused:   Module._ReplayV2_PlayerPaused,
          pause:    Module._ReplayV2_PlayerPause,
          seek:     Module._ReplayV2_PlayerSeek,
          step:     Module._ReplayV2_PlayerStep,
          has:      Module._ReplayV2_PlayerPrediction,
          predAt:   Module._ReplayV2_PlayerPredAt,
          overlay:  Module._ReplayV2_PlayerOverlay,
        };
        return api;
      }

      // ---- what each player saw (PRED and SEEN, docs/PLAYBACK.md) ----
      // The PRED byte (include/srp_writer.h): lag in the low 4 bits, 0x10 stalled,
      // 0x20 replayed by a rollback; the player adds 0x40 "its guess was wrong" and
      // 0x80 "SEEN has it drawn elsewhere". 0xFF: that player's half never arrived.
      var pred = null, timeline = document.getElementById('timeline'), lagEl = document.getElementById('lag');
      var viewBtn = document.getElementById('view');
      var viewNames = ['off', 'player 1', 'player 2', 'both'];
      // seen: something was drawn somewhere it never was. wrong: a guess was not the input
      // that came, whether or not it moved anything visibly.
      function seen(b)  { return b !== 0xFF && (b & 0x80) !== 0; }
      function wrong(b) { return b !== 0xFF && (b & 0xC0) !== 0; }
      function loadPred(n) {
        if (!(api.has() & 1)) return;
        pred = new Uint8Array(2 * n);
        for (var f = 0; f < n; f++) { var v = api.predAt(f); pred[2 * f] = v & 0xFF; pred[2 * f + 1] = (v >> 8) & 0xFF; }
        timeline.hidden = false;
        document.querySelector('.pred').hidden = false;
        drawTimeline();
      }
      function drawTimeline() {
        if (!pred) return;
        var n = pred.length / 2, w = timeline.clientWidth || 600, h = 12;
        timeline.width = w; timeline.height = h;
        var g = timeline.getContext('2d');
        g.fillStyle = '#0b0b0b'; g.fillRect(0, 0, w, h);
        var rgb = [[255, 230, 0], [235, 235, 235]];
        for (var x = 0; x < w; x++) {
          var a = Math.floor(x * n / w), b = Math.max(a + 1, Math.floor((x + 1) * n / w));
          for (var p = 0; p < 2; p++) {
            var lag = 0, bad = false, off = false, known = false;
            for (var f = a; f < b; f++) {
              var v = pred[2 * f + p];
              if (v === 0xFF) continue;
              known = true;
              lag = Math.max(lag, v & 15);
              if (seen(v)) bad = true;
              else if (wrong(v)) off = true;
            }
            if (!known) g.fillStyle = '#222';
            else if (bad) g.fillStyle = '#ff4040';
            else if (off) g.fillStyle = '#b86a20';
            else if (!lag) continue;
            else { var k = 0.25 + 0.75 * Math.min(lag, 8) / 8, c = rgb[p];
                   g.fillStyle = 'rgb(' + (c[0] * k | 0) + ',' + (c[1] * k | 0) + ',' + (c[2] * k | 0) + ')'; }
            g.fillRect(x, p * 6, 1, 5);
          }
        }
      }
      window.addEventListener('resize', drawTimeline);
      timeline.addEventListener('click', function (e) {
        if (!bind() || !pred) return;
        var r = timeline.getBoundingClientRect(), n = pred.length / 2;
        api.pause(1);
        api.seek(Math.floor((e.clientX - r.left) / r.width * n));
      });
      // The start of the next (or previous) run of frames drawn wrong, for the views shown.
      function eventAt(f) {
        var m = api.overlay(-1) || 3;
        return ((m & 1) && seen(pred[2 * f])) || ((m & 2) && seen(pred[2 * f + 1]));
      }
      function jump(dir) {
        if (!bind() || !pred) return;
        var n = pred.length / 2, f = api.frame() + dir;
        for (; f > 0 && f < n; f += dir)
          if (eventAt(f) && !eventAt(f - 1)) { api.pause(1); api.seek(f); return; }
      }
      function lagText(f) {
        if (!pred) return '';
        var out = [];
        for (var p = 0; p < 2; p++) {
          var v = pred[2 * f + p], cls = 'p' + (p + 1);
          if (v === 0xFF) { out.push('<span class="' + cls + '">P' + (p + 1) + ' –</span>'); continue; }
          var t = 'P' + (p + 1) + ' guessed ' + (v & 15);
          if (v & 0x20) t += ', replayed';
          if (v & 0x10) t += ', stalled';
          out.push('<span class="' + cls + '">' + t + '</span>' +
                   (seen(v) ? ' <span class="bad">saw it wrong</span>' :
                    wrong(v) ? ' <span class="off">guess wrong, not visible</span>' : ''));
        }
        return out.join(' &middot; ');
      }
      viewBtn.onclick = function () {
        if (!bind()) return;
        var m = (api.overlay(-1) + 3) % 4;       // both -> player 2 -> player 1 -> off -> both
        api.overlay(m);
        viewBtn.textContent = 'view: ' + viewNames[m];
      };
      function clock(frame, rate) {
        var s = rate > 0 ? Math.floor(frame / rate) : 0;
        return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
      }
      function frameUrl(f) {
        var u = new URL(location.href);
        u.searchParams.set('f', f);
        return u.toString();
      }
      function tick() {
        requestAnimationFrame(tick);
        if (!bind()) return;
        var n = api.frames();
        if (n <= 0) return;
        if (!seeded) {                          // the recording is in: size the bar, honour &f=
          seeded = true;
          scrub.max = String(n - 1);
          if (startFrame >= 0) { api.seek(startFrame); api.pause(1); }
          loadPred(n);
          Module.setStatus('');
        }
        var f = api.frame(), rate = api.rate();
        if (!dragging) scrub.value = String(f);
        if (f !== lastShown) {
          lastShown = f;
          frameEl.textContent = 'frame ' + f + ' / ' + (n - 1) + '  ' + clock(f, rate);
          if (pred) lagEl.innerHTML = lagText(f);
        }
        playBtn.innerHTML = api.paused() ? '&#9654;' : '&#10074;&#10074;';
        // The address follows a paused frame, so a reload or a copied URL lands on it.
        if (api.paused() && f !== lastUrl) {
          lastUrl = f;
          history.replaceState(null, '', frameUrl(f));
        }
      }
      requestAnimationFrame(tick);

      scrub.addEventListener('input', function () {
        dragging = true;
        if (bind()) api.seek(parseInt(scrub.value, 10));
      });
      scrub.addEventListener('change', function () { dragging = false; });
      function step(d) { if (bind()) api.step(d); }
      function toggle() { if (bind()) api.pause(api.paused() ? 0 : 1); }
      document.getElementById('back10').onclick = function () { step(-10); };
      document.getElementById('back1').onclick  = function () { step(-1); };
      document.getElementById('fwd1').onclick   = function () { step(1); };
      document.getElementById('fwd10').onclick  = function () { step(10); };
      playBtn.onclick = toggle;
      document.getElementById('prevEv').onclick = function () { jump(-1); };
      document.getElementById('nextEv').onclick = function () { jump(1); };
      document.getElementById('copy').onclick = function () {
        if (!bind()) return;
        api.pause(1);
        var url = frameUrl(api.frame()), btn = this;
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
          .then(function () { btn.textContent = 'copied'; },
                function () { prompt('Link to this frame:', url); })
          .then(function () { setTimeout(function () { btn.textContent = 'copy link'; }, 1500); });
      };
      document.addEventListener('keydown', function (e) {
        if (e.target === scrub && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) e.preventDefault();
        if (e.key === ' ') { toggle(); e.preventDefault(); }
        else if (e.key === 'ArrowLeft')  { step(e.shiftKey ? -10 : -1); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { step(e.shiftKey ? 10 : 1); e.preventDefault(); }
        else if (e.key === ']') { jump(1); e.preventDefault(); }
        else if (e.key === '[') { jump(-1); e.preventDefault(); }
        else if (e.key === 'v' || e.key === 'V') { viewBtn.click(); e.preventDefault(); }
      });
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
